version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sdo_backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      - DATABASE_URL=sqlite:///sutrix_science.db
      - SDO_UPLOAD_DIR=uploads
      - SDO_OUTPUT_DIR=outputs
      - SDO_MAX_FILE_SIZE_MB=100
      - SDO_API_RATE_LIMIT=0.1
      - SENTRY_DSN=
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sdo_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
